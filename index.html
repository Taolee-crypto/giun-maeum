<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>기운과 마음 — 사주×MBTI</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood: #4CAF50; --wood-bg: #E8F5E9; --wood-txt: #2E7D32;
      --fire: #FF7043; --fire-bg: #FFF3E0; --fire-txt: #E64A19;
      --earth: #C08B52; --earth-bg: #FFF8E1; --earth-txt: #8D6E63;
      --metal: #607D8B; --metal-bg: #ECEFF1; --metal-txt: #455A64;
      --water: #5C6BC0; --water-bg: #E8EAF6; --water-txt: #3949AB;
      --bg: #FAF8F5; --card: #FFFFFF; --text: #2D2D2D; --muted: #888;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.1);
      --radius: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * {box-sizing:border-box; margin:0; padding:0; font-family:"Noto Sans KR", sans-serif; -webkit-tap-highlight-color:transparent;}
    body {background:var(--bg); color:var(--text); line-height:1.7; min-height:100vh;}
    .screen {display:none; min-height:100vh; padding:1.5rem; max-width:520px; margin:0 auto; animation:fadeIn 0.4s ease-out;}
    .screen.active {display:block;}
    @keyframes fadeIn {from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
    h1 {font-size:1.8rem; font-weight:700; margin-bottom:0.3rem; text-align:center;}
    h2 {font-size:1.2rem; font-weight:600; margin:2rem 0 1rem; padding-bottom:0.5rem; border-bottom:1px solid #eee;}
    .subtitle {text-align:center; color:var(--muted); margin-bottom:2rem;}
    .card {background:var(--card); border-radius:var(--radius); padding:1.5rem; margin-bottom:1.2rem; box-shadow:var(--shadow); transition:var(--transition);}
    .card:hover {box-shadow:var(--shadow-hover);}
    .btn {display:block; width:100%; padding:1rem; border:none; border-radius:14px; font-size:1rem; font-weight:600; cursor:pointer; transition:var(--transition); font-family:inherit;}
    .btn-primary {background:linear-gradient(135deg, #5C6BC0, #7E57C2); color:white; margin-top:1rem;}
    .btn-primary:hover {transform:translateY(-2px);}
    .btn-option {background:#fff; border:2px solid #eee; margin-bottom:0.8rem; text-align:left;}
    .btn-option.selected {border-color:var(--water); background:#F3F4FC;}
    input {width:100%; padding:0.9rem 1rem; border:2px solid #eee; border-radius:12px; font-size:1rem; margin-bottom:1rem; font-family:inherit; transition:var(--transition);}
    input:focus {outline:none; border-color:var(--water);}
    .tag {display:inline-block; padding:0.4rem 0.9rem; border-radius:20px; font-size:0.85rem; font-weight:600; margin:0.25rem 0.4rem 0.25rem 0;}
    .tag.wood {background:var(--wood-bg); color:var(--wood-txt);}
    .tag.fire {background:var(--fire-bg); color:var(--fire-txt);}
    .tag.earth {background:var(--earth-bg); color:var(--earth-txt);}
    .tag.metal {background:var(--metal-bg); color:var(--metal-txt);}
    .tag.water {background:var(--water-bg); color:var(--water-txt);}
    .progress {height:6px; background:#eee; border-radius:3px; margin-bottom:1.5rem;}
    .progress>div {height:100%; background:linear-gradient(90deg, #5C6BC0, #7E57C2); border-radius:3px; transition:width 0.4s ease;}
    .person-card {border-left:4px solid; padding-left:1rem; margin:1rem 0; transition:var(--transition);}
    .person-card:hover {transform:translateX(4px);}
    .hidden {display:none !important;}
    ul {margin:0.5rem 0 1rem 1.5rem;}
    li {margin-bottom:0.4rem;}
    small {font-weight:400; color:var(--muted); font-size:0.85rem;}
    .grid {display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;}
  </style>
</head>
<body>

<section id="splash" class="screen active">
  <h1 style="margin-top:5rem;">🌿 기운과 마음</h1>
  <p class="subtitle">사주와 MBTI가 만나는 곳</p>
  <button class="btn btn-primary" onclick="go('input')" style="margin-top:3rem;">시작하기</button>
  <p style="text-align:center; margin-top:3rem; font-size:0.85rem; color:#999; line-height:1.8;">
    어떤 정보도 서버에 저장되지 않습니다<br>
    모든 연산은 기기 내에서 처리 후 즉시 폐기됩니다
  </p>
</section>

<section id="input" class="screen">
  <h2 style="text-align:center; margin-top:3rem;">언제 태어나셨나요?</h2>
  <input type="date" id="birthDate" placeholder="생년월일">
  <input type="time" id="birthTime" placeholder="태어난 시간 (모르면 비워두세요)">
  <div style="display:flex; gap:0.8rem; margin-bottom:1rem;">
    <button class="btn btn-option selected" id="solBtn" onclick="setCal('solar')">☀️ 양력</button>
    <button class="btn btn-option" id="lunBtn" onclick="setCal('lunar')">🌙 음력</button>
  </div>
  <button class="btn btn-primary" onclick="go('mbti')">다음 — 성향 질문</button>
</section>

<section id="mbti" class="screen">
  <div class="progress"><div id="pbar" style="width:0%"></div></div>
  <h2 id="qTitle">질문 1/12</h2>
  <p id="qText" style="font-size:1.1rem; margin-bottom:1.5rem; line-height:1.8;"></p>
  <button class="btn btn-option" id="opt1" onclick="ans(1)"></button>
  <button class="btn btn-option" id="opt2" onclick="ans(2)"></button>
  <button class="btn" style="background:#f5f5f5; margin-top:1rem;" onclick="prevQ()">이전 질문</button>
</section>

<section id="result" class="screen">
  <h1>당신의 기운 프로필</h1>
  <div class="card">
    <span id="rTags"></span>
    <p id="rCore" style="font-size:1.05rem; margin:1rem 0; font-weight:500; line-height:1.8;"></p>
  </div>

  <h2>🌟 나와 닮은 기운을 가진 인물</h2>
  <div id="personBox" class="card"></div>

  <h2>💪 강점 & 🌱 성장 포인트</h2>
  <div class="card">
    <p><strong>✅ 강점</strong></p>
    <ul id="rStrength"></ul>
    <p style="margin-top:1rem;"><strong>🌱 함께 키우면 좋은 점</strong></p>
    <ul id="rGrowth"></ul>
  </div>

  <h2>☀️ 오늘의 조언</h2>
  <div class="card">
    <p id="rDailySum" style="font-weight:600; margin-bottom:0.5rem;"></p>
    <p id="rDailyDo" style="margin-bottom:0.5rem;"></p>
    <p id="rDailyAvoid" style="color:var(--fire-txt);"></p>
  </div>

  <h2>💬 상담하기</h2>
  <div class="grid">
    <button class="btn btn-option" onclick="advice('career')">💼 진로·직업</button>
    <button class="btn btn-option" onclick="advice('relation')">❤️ 관계</button>
    <button class="btn btn-option" onclick="advice('decision')">🧭 의사결정</button>
    <button class="btn btn-option" onclick="advice('selfcare')">🌿 자기돌봄</button>
  </div>
  <div id="adviceBox" class="card hidden" style="margin-top:1rem;"></div>

  <button class="btn btn-primary" style="margin-top:2.5rem;" onclick="reset()">다시 시작</button>
</section>

      case 2: a===1 ? scores.T++ : scores.F++; break;
      case 3: a===1 ? scores.J++ : scores.P++; break;
      case 4: a===1 ? scores.N++ : scores.S++; break;
      case 5: a===1 ? scores.E++ : scores.I++; break;
      case 6: a===1 ? scores.N++ : scores.S++; break;
      case 7: a===1 ? scores.E++ : scores.I++; break;
      case 8: a===1 ? scores.T++ : scores.F++; break;
      case 9: a===1 ? scores.J++ : scores.P++; break;
      case 10: a===1 ? scores.N++ : scores.S++; break;
      case 11: a===1 ? scores.E++ : scores.I++; break;
    }
  });
  const type = (scores.E>scores.I?'E':'I') + (scores.N>scores.S?'N':'S') + 
               (scores.F>scores.T?'F':'T') + (scores.J>scores.P?'J':'P');
  
  const [y, m, d] = birthDate.split('-').map(Number);
  const sum = y+m+d;
  const elemMap = ['wood','fire','earth','metal','water'];
  let strongestElem = elemMap[sum % 5];
  
  const mainFunc = ['ENFP','INFP'].includes(type) ? 'Ne' :
                   ['ENFJ','INFJ'].includes(type) ? 'Ni' :
                   ['ESFJ','ISFJ'].includes(type) ? 'Si' :
                   ['ESFP','ISFP'].includes(type) ? 'Se' :
                   ['ENTJ','INTJ'].includes(type) ? 'Ni' :
                   ['ESTJ','ISTJ'].includes(type) ? 'Si' :
                   ['ESTP','ISTP'].includes(type) ? 'Se' : 'Ne';
  
  let code;
  if (strongestElem === 'wood') code = ['Ne','Ni'].includes(mainFunc) ? `WOOD_${mainFunc}` : 'WOOD_Ne';
  else if (strongestElem === 'fire') code = ['Fe','Fi'].includes(mainFunc) ? `FIRE_${mainFunc}` : 'FIRE_Fe';
  else if (strongestElem === 'earth') code = ['Si','Se'].includes(mainFunc) ? `EARTH_${mainFunc}` : 'EARTH_Si';
  else if (strongestElem === 'metal') code = ['Te','Ti'].includes(mainFunc) ? `METAL_${mainFunc}` : 'METAL_Te';
  else code = 'WATER_NiTi';
  
  return {code, mbtiType: type, strongestElem};
}

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setCal(t) {
  calType = t;
  document.getElementById('solBtn').classList.toggle('selected', t === 'solar');
  document.getElementById('lunBtn').classList.toggle('selected', t === 'lunar');
}

function renderQ() {
  const q = questions[qIdx];
  document.getElementById('qTitle').textContent = `질문 ${qIdx+1}/${questions.length}`;
  document.getElementById('qText').textContent = q.t;
  document.getElementById('opt1').textContent = q.o1;
  document.getElementById('opt2').textContent = q.o2;
  document.getElementById('pbar').style.width = `${(qIdx+1)/questions.length*100}%`;
}

function ans(n) {
  answers[qIdx] = n;
  if (qIdx < questions.length - 1) {
    qIdx++;
    renderQ();
  } else {
    showResult();
  }
}

function prevQ() {
  if (qIdx > 0) { qIdx--; renderQ(); }
}

function showResult() {
  const birthDate = document.getElementById('birthDate').value || '1995-05-20';
  const {code, mbtiType} = calculateProfile(birthDate, answers);
  const profile = ProfileTemplates[code];
  currentProfile = profile;
  const persons = PersonDB[code] || [];

  document.getElementById('rTags').innerHTML = `
    <span class="tag ${profile.elem}">${profile.tag}</span>
    <span class="tag ${profile.elem}">${mbtiType}</span>
  `;
  document.getElementById('rCore').textContent = profile.core;
  document.getElementById('personBox').innerHTML = persons.map(p => `
    <div class="person-card" style="border-color:var(--${profile.elem});">
      <h4>${p.name}</h4>
      <p style="margin:0.4rem 0; font-size:0.95rem;">${p.desc}</p>
      <p style="color:var(--${profile.elem}-txt); font-weight:500;">💡 ${p.tip}</p>
    </div>
  `).join('');
  document.getElementById('rStrength').innerHTML = profile.strength.map(s => `<li>${s}</li>`).join('');
  document.getElementById('rGrowth').innerHTML = profile.growth.map(g => `<li>${g}</li>`).join('');
  document.getElementById('rDailySum').textContent = profile.daily.sum;
  document.getElementById('rDailyDo').textContent = profile.daily.do;
  document.getElementById('rDailyAvoid').textContent = profile.daily.avoid;

  go('result');
}

function advice(cat) {
  const box = document.getElementById('adviceBox');
  box.classList.remove('hidden');
  box.innerHTML = `<p style="line-height:1.8;">${currentProfile.advice[cat]}</p>`;
  box.scrollIntoView({behavior: 'smooth'});
}

function reset() {
  qIdx = 0; answers = []; currentProfile = null;
  go('splash');
}

renderQ();
</script>
</body>
